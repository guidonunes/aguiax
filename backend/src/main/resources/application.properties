spring.application.name=aguiax

# MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# MongoDB
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE}

# Security
api.security.token.secret=${JWT_SECRET}

# REMOVE TRACE IN ERROR RESPONSE
spring.web.error.include-stacktrace=never

# AI provider
app.ai.enabled=${AI_ENABLED:false}
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.api-key=${AI_API_KEY:}
app.ai.model=${AI_MODEL:gemini-3.6-flash}
app.ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.connect-timeout=${AI_CONNECT_TIMEOUT_MS:3000}ms
app.ai.read-timeout=${AI_READ_TIMEOUT_MS:15000}ms

# Observability / Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*

# Public health must expose only the overall status
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Safe application metadata exposed by /actuator/info
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=AguiaX innovation management API
info.app.version=0.0.1-SNAPSHOT

# API documentation is opt-in through the local profile
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
